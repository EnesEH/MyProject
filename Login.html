<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/train.png" sizes="300x300" type="image/png">
    <title>Login & Registration</title>
    <link rel="stylesheet" href="Login.css">
    <script src="skriptiJashtem.js"></script>
</head>
<body>
    <div class="logo">
        <a href="./index.html"><img src="./images/logo.png" alt=""></a>
    </div>
      <nav class="nav-container">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About Us</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="ContactUs.html">Contact Us</a></li>
        </ul>        
    </nav>
    <div class="container">
        <input type="checkbox" id="check">
        <div class="login form">
            <header>Login</header>
            <form onsubmit="validateLogin(); return false;">
                <input type="text" id="loginEmail" placeholder="Enter your email">
                <input type="password" id="loginPassword" placeholder="Enter your password">
                <a href="#">Forgot password?</a>
                <input type="submit" class="button" value="Login">
            </form>
            <div class="signup">
                <span class="signup">Don't have an account?
                    <label for="check" onclick="showRegistration()">Signup</label>
                </span>
            </div>
        </div>

        <div class="registration form">
            <header>Signup</header>
            <form onsubmit="validateSignup(); return false;">
                <input type="text" id="signupEmail" placeholder="Enter your email">
                <input type="password" id="signupPassword" placeholder="Create a password">
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
                <input type="submit" class="button" value="Signup">
            </form>
            <div class="signup">
                <span class="signup">Already have an account?
                    <label for="check" onclick="showLogin()">Login</label>
                </span>
            </div>
        </div>
    </div>
   </body>
</html>
